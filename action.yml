name: "action-user-repos-json"
description: "A Github action to output repositories owned (or contributed to) by a user, as a JSON file."
branding:
  icon: "user"
  color: "blue"
inputs:
  username:
    description: "The Github username to retrieve the repositories of"
    default: ${{ github.repository_owner }}
  minimum-stargazers:
    description: "The minimum number of stargazers a repository should have"
    default: "0"
  limit:
    description: "Limit the number of repositories to be retrieved"
    default: "100"
  languages-limit:
    description: "Limit the number of associated languages to retrieve for each repository"
    default: "10"
  include-contributed:
    description: "Whether to include repositories the user has contributed to but does not own"
    default: "false"
  contributed-limit:
    description: "Limit the number of contributed-to repositories to retrieve (only used when include-contributed is true)"
    default: "100"
  output-path:
    description: "Output file path"
    default: ${{ github.workspace }}/repositories.json
  sort-by:
    description: "Repository field to sort results by (createdAt, name, owner, stargazerCount, updatedAt, url)"
    default: "updatedAt"
  sort-asc:
    description: "Sort in ascending order instead of the default descending"
    default: "false"
outputs:
  json-path:
    description: "The JSON file output"
runs:
  using: node24
  main: dist/index.js
